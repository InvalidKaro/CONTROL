[platformio]
default_envs = t_embed_cc1101_plus
boards_dir = boards

[env:t_embed_cc1101_plus]
platform = espressif32@6.13.0
board = T_Embed_PN532
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; LilyGO T-Embed CC1101 Plus / PN532:
; 16 MB flash + OPI PSRAM.
; Most hardware memory settings come from boards/T_Embed_PN532.json.

build_flags =
    -I src/core
    -I src/hal
    -I src/apps

    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_RUNNING_CORE=0
    -D ARDUINO_EVENT_RUNNING_CORE=0
    -D BOARD_HAS_PSRAM=1
    -D CORE_DEBUG_LEVEL=1

    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=170
    -D TFT_HEIGHT=320
    -D TFT_MOSI=9
    -D TFT_MISO=10
    -D TFT_SCLK=11
    -D TFT_CS=41
    -D TFT_DC=16
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_INVERSION_ON=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1

    -D RADIOLIB_STATIC_ONLY=1

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    jgromes/RadioLib@^7.7.1
    adafruit/Adafruit PN532@^1.3.4
    crankyoldgit/IRremoteESP8266@^2.8.6
    nrf24/RF24@^1.4.11
    adafruit/Adafruit NeoPixel@^1.12.3
    links2004/WebSockets@^2.7.3
    ricmoo/QRCode@^0.0.1
    bblanchon/ArduinoJson@^7.4.3
